<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grid Areas</title>
        <style>
            .container {
                height: 80vh;
                border: 2px solid black;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;
                grid-template-areas:
                    "navbar         navbar          navbar    navbar"
                    "main-content   main-content    .         side-bar"
                    "footer         footer          footer    footer";
            }

            .item {
                border: 2px solid red;
            }

            .navbar {
                grid-area: navbar;
                background-color: lightsalmon;
                text-align: center;
                display: grid;
                place-content: center;
            }

            .main-content {
                grid-area: main-content;
                background-color: lightpink;
                display: grid;
                place-content: center;
            }

            .side-bar {
                grid-area: side-bar;
                background-color: lightgreen;
                display: grid;
                place-content: center;
            }

            .footer {
                grid-area: footer;
                background-color: lightcoral;
                display: grid;
                place-content: center;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="item navbar">Naviagation Bar</div>
            <div class="item main-content">Main Content</div>
            <div class="item side-bar">Sidebar</div>
            <div class="item footer">Footer</div>
        </div>
    </body>
</html>
